name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (build · vet · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: gofmt is clean
        run: |
          bad=$(gofmt -l $(find apps packages -name '*.go'))
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - name: "Build (workspace: api + worker + shared packages)"
        run: go build ./apps/api/... ./packages/config/... ./packages/types/...
      - name: Vet
        run: go vet ./apps/api/... ./packages/config/... ./packages/types/...
      - name: Unit tests (race detector)
        run: go test -race -count=1 ./apps/api/... ./packages/config/... ./packages/types/...
      - name: Binaries compile with release flags
        run: |
          cd apps/api
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags "-s -w" -o /tmp/api ./cmd/api
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags "-s -w" -o /tmp/worker ./cmd/worker
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags "-s -w" -o /tmp/migrate ./cmd/migrate
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags "-s -w" -o /tmp/seed ./cmd/seed

  python:
    name: Python (ruff · compileall · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/ml/requirements.txt
            apps/ml/requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Byte-compile (import-graph sanity)
        run: python -m compileall -q app tests benchmarks
      - name: Unit tests
        run: python -m pytest -q

  web:
    name: Web (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_PROXY_API: "true"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [go, python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Compose manifest is valid
        run: docker compose config -q
      - name: Build api image
        run: docker build -t visionforge/api:ci -f infrastructure/docker/Dockerfile.api .
      - name: Build ml image
        run: docker build -t visionforge/ml:ci -f infrastructure/docker/Dockerfile.ml .
      - name: Build web image
        run: docker build -t visionforge/web:ci -f infrastructure/docker/Dockerfile.web apps/web

  compose-smoke:
    name: E2E smoke against the full stack
    runs-on: ubuntu-latest
    needs: [go, python, web, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test image generator deps
        run: python -m pip install --quiet pillow
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for API readiness
        run: |
          timeout 300 bash -c 'until curl -fs http://localhost:8080/ready >/dev/null; do sleep 3; done'
      - name: Run E2E smoke suite (auth, projects, presigned upload, sync+async inference)
        run: python scripts/e2e_smoke.py --base http://localhost:8080/api/v1
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
